run_name: "segformer_mit_b2-coralscapes_lv2"

data:
  root: "coralscapes_lv2"
  batch_size: 4
  batch_size_eval: 4
  weight: True

augmentation:
  train:
    RandomScale:
      scale_limit: [0, 1]
    RandomCrop:
      width: 1024
      height: 1024
    HorizontalFlip:
      p: 0.5
    RandomBrightnessContrast:
      brightness_limit: 0.2
      contrast_limit: 0.2
      p: 0.5
    HueSaturationValue:
      hue_shift_limit: 10
      sat_shift_limit: 20
      val_shift_limit: 10
      p: 0.5
    GaussianBlur:
      blur_limit: [3, 7]
      p: 0.3
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  val:
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  test:
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

model:
  name: "segformer-mit-b2"
  # Leave checkpoint blank to use HuggingFace pretrained weights,
  # or set to a previously trained Lv3 checkpoint to fine-tune:
  # checkpoint: "model_checkpoints/final_model_checkpoints/segformer_mit_b2_epoch265"

training:
  epochs: 300
  optimizer:
    type: torch.optim.AdamW
    lr: 0.00006
    weight_decay: 0.01
  loss:
    type: "cross_entropy"
    ignore_index: 0      # pixel value 0 = unlabeled, ignored during training
  scheduler:
    type: torch.optim.lr_scheduler.PolynomialLR
    power: 1
    total_iters: 300
  preprocessor: "segformer"
  eval:
    sliding_window: True
    window: 1024
    stride: 1024
    transform_target: False

logger:
  wandb_project: "coralscapes-hierarchical"
  wandb_disabled: true
  log_epochs: 5
  checkpoint_dir: ".."
