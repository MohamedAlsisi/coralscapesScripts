run_name: "segformer_mit_b2-sponges_sp10_strat"

data:
  root: "Sponges/Sponges_18167_sp10_strat"
  batch_size: 1         # reduced to avoid OOM
  batch_size_eval: 1
  weight: True          # ← class weights to handle imbalance

augmentation:
  train:
    RandomScale:
      scale_limit: [0, 1]
    RandomCrop:
      width: 1024
      height: 1024
    HorizontalFlip:
      p: 0.5
    RandomBrightnessContrast:
      brightness_limit: 0.2
      contrast_limit: 0.2
      p: 0.5
    HueSaturationValue:
      hue_shift_limit: 10
      sat_shift_limit: 20
      val_shift_limit: 10
      p: 0.5
    GaussianBlur:
      blur_limit: [3, 7]
      p: 0.3
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  val:
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  test:
    Normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

model:
  name: "segformer-mit-b2"
checkpoint: "/home/mohamed/student/mo/coralscapesScripts/model_checkpoints/final_model_checkpoints/segformer_mit_b2_epoch265"

training:
  epochs: 100            # longer training for convergence
  optimizer:
    type: torch.optim.AdamW
    lr: 0.00006           # slightly higher than the initial fine-tune
    weight_decay: 0.01
  loss:
    type: "cross_entropy"
    ignore_index: 255
  scheduler:
    type: torch.optim.lr_scheduler.PolynomialLR
    power: 1
    total_iters: 100
  preprocessor: "segformer"
  eval:
    sliding_window: False
    window: 1024
    stride: 1024
    transform_target: False

logger:
  wandb_project: "coralscapes-sponges"
  wandb_disabled: true
  log_epochs: 5
  checkpoint_dir: ".."
